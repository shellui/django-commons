[project]
name = "shellui-django"
version = "0.5.0"
description = "Shared Django libraries for Shellui services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "djangorestframework", "mcp", "shellui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.14"
authors = [{ name = "Sébastien Barbier" }]
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.2",
]

[project.urls]
Homepage = "https://shellui.com"
Source = "https://github.com/shellui/django-commons"
Documentation = "https://github.com/shellui/django-commons/tree/main/docs"
Changelog = "https://github.com/shellui/django-commons/blob/main/CHANGELOG.md"
Issues = "https://github.com/shellui/django-commons/issues"

[project.optional-dependencies]
mcp = [
    "cryptography>=50.0.0",
    "djangorestframework-simplejwt==5.5.1",
    "pyjwt>=2.14.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.9.0",
]
test = [
    "shellui-django[mcp]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellui_django"]
exclude = [
  "**/tests/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
"src/shellui_django/mcp/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shellui_django"]
