[project]
name = "shellui-django"
version = "0.9.0"
description = "Shared Django libraries for Shellui services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "djangorestframework", "mcp", "opentelemetry", "shellui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.14"
authors = [{ name = "Sébastien Barbier" }]
dependencies = [
    "django==6.1.3",
    "djangorestframework==3.18.3",
]

[project.urls]
Homepage = "https://shellui.com"
Source = "https://github.com/shellui/django-commons"
Documentation = "https://github.com/shellui/django-commons/tree/main/docs"
Changelog = "https://github.com/shellui/django-commons/blob/main/CHANGELOG.md"
Issues = "https://github.com/shellui/django-commons/issues"

[project.optional-dependencies]
mcp = [
    "cryptography>=50.0.0",
    "drf-spectacular==0.30.0",
    "djangorestframework-simplejwt==5.5.1",
    "pyjwt>=2.14.0",
    "requests>=2.32.0",
]
otel = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-django[asgi]==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-psycopg==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.9.0",
]
test = [
    "celery>=5.6,<6",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "redis>=5",
    "shellui-django[mcp,otel]",
]

[tool.pytest.ini_options]
testpaths = [
    "src/shellui_django/mcp/tests",
    "src/shellui_django/telemetry/tests",
    "src/shellui_django/ui/tests",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellui_django"]
exclude = [
  "**/tests/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
"src/shellui_django/mcp/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shellui_django"]
