name: Publish to PyPI

# Two jobs, so the one that can publish never runs repository code:
#   build    contents: read only. Checks the tag, builds with a pinned build environment, verifies the build,
#            and uploads the files as an artifact.
#   publish  id-token: write. No checkout. Downloads the artifact, checks it against the build job's digests,
#            and publishes it.

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so the next step can tell whether the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at ${commit}, which is not on main. Tag a commit that is on main." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.1'
          python-version: '3.15'
          enable-cache: false

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${tag}" != "${version}" ]; then
            echo "Tag v${tag} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Install the pinned build environment
        run: |
          set -euo pipefail
          uv venv --python 3.15 "${RUNNER_TEMP}/build-env"
          uv pip install --python "${RUNNER_TEMP}/build-env" --require-hashes --only-binary :all: --no-deps -r requirements-build.txt

      - name: Build
        run: uv build --no-build-isolation --python "${RUNNER_TEMP}/build-env/bin/python" --out-dir dist

      - name: Verify the build is what the tagged commit builds
        run: '"${RUNNER_TEMP}/build-env/bin/python" scripts/verify_dist.py dist "${GITHUB_SHA}" "${GITHUB_REF_NAME#v}"'

      - name: Record digests
        id: digests
        run: |
          set -euo pipefail
          cd dist
          echo "digests=$(sha256sum -- *.whl *.tar.gz | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the files are the ones the build job made
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          cd dist
          echo "${DIGESTS}" | base64 -d | sha256sum --check --strict
          test "$(ls -1 | wc -l)" -eq 2

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
